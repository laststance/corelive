packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - '@clerk/shared'
  - '@tailwindcss/oxide'
  - core-js-pure
  - electron
  - electron-winstaller
  - esbuild
  - msw
  - sharp
  - unrs-resolver
patchedDependencies: {}
nodeLinker: hoisted
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
verifyStoreIntegrity: true
catalog:
  '@types/node': ^26.4.1
  '@vitest/coverage-v8': 5.0.0
  cross-env: ^10.1.0
  eslint: ^10.10.0
  eslint-config-ts-prefixer: ^5.0.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-you-might-not-need-an-effect: ^1.0.2
  prettier: ^3.9.6
  prettier-plugin-tailwindcss: ^0.8.1
  typescript: 6.0.3
  vitest: ^5.0.0
  pino: ^10.3.1
  zod: ^4.5.4
  pino-pretty: ^13.1.3
  thread-stream: ^4.2.0
  ts-expect: ^1.3.0
  tsx: ^4.23.13
  vite: ^8.2.2
  sharp: ^0.35.4
  dotenv: ^17.4.2
