# Production Database Migration Workflow
#
# This workflow deploys pending Drizzle migrations to the production database.
#
# Usage:
#   1. Manual trigger: Go to Actions > DB Migrate > Run workflow
#   2. Auto trigger: Push migration files to drizzle/ (or src/db/schema.ts) on main branch
#
# Required GitHub Secrets:
#   - POSTGRES_PRISMA_URL: Production PostgreSQL connection string
#
# Recommended Setup:
#   1. Create a "production" environment in GitHub repository settings
#   2. Add required reviewers for the "production" environment
#   3. This provides an approval gate before migrations run
#
name: DB Migrate

on:
  # Manual trigger with confirmation
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production migration'
        required: true
        type: string
      dry_run:
        description: 'Dry run (only check status, do not apply)'
        required: false
        default: false
        type: boolean

  # Auto-trigger when migrations are added to main branch
  push:
    branches:
      - main
    paths:
      - 'drizzle/**'
      - 'src/db/schema.ts'

permissions:
  contents: read

# Prevent concurrent migrations
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Deploy Migrations
    runs-on: ubuntu-latest

    # Use production environment for approval gate
    environment: production

    steps:
      - name: Validate confirmation (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::Confirmation failed. You must type 'DEPLOY' to run production migrations."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/prepare

      # drizzle-kit has no `migrate status`. `check` validates the committed migration
      # folder (journal, snapshots, no collisions) without touching the database.
      - name: Check migration files
        run: pnpm exec drizzle-kit check

      # The migrator applies every file newer than the newest row in
      # drizzle.__drizzle_migrations, all inside one transaction. A database that is
      # already up to date is a no-op.
      - name: Deploy migrations
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
        run: |
          echo "🚀 Deploying migrations to production database..."
          pnpm exec drizzle-kit migrate
          echo "✅ Migrations deployed successfully!"

      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "🔍 Dry run mode - migration files were checked, nothing was applied"
          echo "Run this workflow again with 'dry_run: false' to apply migrations"
