# Production Database Migration Workflow
#
# This workflow deploys pending Drizzle migrations to the production database.
#
# Usage:
#   1. Manual trigger: Go to Actions > DB Migrate > Run workflow
#   2. Auto trigger: Push migration files to drizzle/ (or src/db/schema.ts) on main branch
#
# Required GitHub Secrets:
#   - POSTGRES_PRISMA_URL: Production PostgreSQL connection string
#
# One-off baseline (the cutover from the previous ORM):
#   Production's tables were built by the previous ORM's migrations, so `drizzle-kit migrate` would
#   try to CREATE them again. Before the first run of this workflow, record `0000_init` as applied
#   with ONE row, from a machine that holds the production URL:
#     POSTGRES_PRISMA_URL=<prod> node scripts/baseline-drizzle-migrations.mjs           # read-only report
#     POSTGRES_PRISMA_URL=<prod> node scripts/baseline-drizzle-migrations.mjs --apply   # writes the row
#   The "Check baseline" step below refuses to migrate a database that has tables but no row, so a
#   forgotten baseline fails here without touching anything. Merging the cutover PR to main triggers
#   this workflow (drizzle/** changed), so the baseline must be recorded BEFORE that merge.
#
# Recommended Setup:
#   1. Create a "production" environment in GitHub repository settings
#   2. Add required reviewers for the "production" environment
#   3. This provides an approval gate before migrations run
#
name: DB Migrate

on:
  # Manual trigger with confirmation
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production migration'
        required: true
        type: string
      dry_run:
        description: 'Dry run (validate the migration files and read the database state, do not apply)'
        required: false
        default: false
        type: boolean

  # Auto-trigger when migrations are added to main branch
  push:
    branches:
      - main
    paths:
      - 'drizzle/**'
      - 'src/db/schema.ts'

permissions:
  contents: read

# Prevent concurrent migrations
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Deploy Migrations
    runs-on: ubuntu-latest

    # Use production environment for approval gate
    environment: production

    steps:
      - name: Validate confirmation (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::Confirmation failed. You must type 'DEPLOY' to run production migrations."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/prepare

      # drizzle-kit has no `migrate status`. `check` validates the committed migration
      # folder (journal, snapshots, no collisions) without touching the database.
      - name: Check migration files
        run: pnpm exec drizzle-kit check

      # Read-only: fails when application tables exist but drizzle.__drizzle_migrations has no
      # row (the baseline was never recorded), which would make the migrator re-create them.
      # Also runs on a dry run, so the operator sees the verdict without applying anything.
      - name: Check baseline
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
        run: node scripts/baseline-drizzle-migrations.mjs

      # The migrator applies every file newer than the newest row in
      # drizzle.__drizzle_migrations, all inside one transaction. A database that is
      # already up to date is a no-op. drizzle.config.ts refuses any non-local target
      # unless DRIZZLE_ALLOW_REMOTE=1: this is the one place production is meant.
      - name: Deploy migrations
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          DRIZZLE_ALLOW_REMOTE: '1'
        run: |
          echo "🚀 Deploying migrations to production database..."
          pnpm exec drizzle-kit migrate
          echo "✅ Migrations deployed successfully!"

      # Read-only: the newest recorded migration must now equal the newest file in the journal.
      - name: Verify migrated state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
        run: node scripts/baseline-drizzle-migrations.mjs --expect-current

      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "🔍 Dry run mode - migration files were checked and the database state was read, nothing was applied"
          echo "Run this workflow again with 'dry_run: false' to apply migrations"
