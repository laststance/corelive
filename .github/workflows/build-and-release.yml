name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: Run type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test --run

      - name: Generate Icons 🎨
        run: pnpm build:icons

      - name: Run Electron tests
        run: pnpm test:electron --run

  build:
    name: Build and verify Apple Silicon package
    needs: test
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        uses: ./.github/actions/prepare

      - name: Verify the native MCP bridge on Apple Silicon
        run: |
          node -e "require('node:assert/strict').equal(process.arch, 'arm64')"
          pnpm --filter @corelive/desktop exec vitest run --config vitest.config.electron.ts electron/mcp/bridge.integration.test.ts

      - name: Match the release tag to the desktop package
        if: github.ref_type == 'tag'
        run: node -e "require('node:assert/strict').equal(process.env.GITHUB_REF_NAME, 'v' + require('./apps/desktop/package.json').version)"

      - name: Set environment variables
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
        shell: bash
        run: |
          {
            printf 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=%s\n' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            printf 'NEXT_PUBLIC_CLERK_SIGN_IN_URL=%s\n' "$NEXT_PUBLIC_CLERK_SIGN_IN_URL"
            printf 'NEXT_PUBLIC_CLERK_SIGN_UP_URL=%s\n' "$NEXT_PUBLIC_CLERK_SIGN_UP_URL"
            printf 'NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL=%s\n' "$NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL"
            printf 'CLERK_SECRET_KEY=%s\n' "$CLERK_SECRET_KEY"
            printf 'WEBHOOK_SECRET=%s\n' "$WEBHOOK_SECRET"
            printf 'POSTGRES_PRISMA_URL=%s\n' "$POSTGRES_PRISMA_URL"
          } > apps/web/.env

      - name: Build Next.js app
        run: pnpm build

      - name: Import Code-Signing Certificates
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: Apple-Actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}

      - name: Build Electron app (macOS) — signed release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        # Reuse the imported keychain; electron-builder's reimport mixes keychain and certificate passwords.
        run: CSC_KEYCHAIN="$HOME/Library/Keychains/signing_temp.keychain-db" pnpm electron:build:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the ad-hoc Apple Silicon app for QA
        if: "!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))"
        # The hosted Mac can cold-start an ad-hoc app without the release certificate.
        run: pnpm electron:build:dir --config.mac.identity=- --config.mac.timestamp=none --config.mac.notarize=false
        env:
          CSC_FOR_PULL_REQUEST: 'true'

      - name: Verify bundled MCP discovery, device writes and reconnection
        run: pnpm --filter @corelive/desktop qa:mcp-package

      - name: Verify the background cold start on Apple Silicon
        if: github.event_name == 'pull_request'
        run: pnpm --filter @corelive/desktop qa:mcp-package dist/mac-arm64/CoreLive.app --hosted-cold-start

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-app-macos
          path: |
            apps/desktop/dist/*-arm64.dmg
            apps/desktop/dist/*-arm64-mac.zip
            apps/desktop/dist/*-arm64-mac.zip.blockmap
            apps/desktop/dist/latest-mac.yml
            apps/desktop/dist/checksums.json
          if-no-files-found: error
          retention-days: 30

  signed-mac-package:
    name: Verify signed Apple Silicon release archive
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: electron-app-macos
          path: ${{ runner.temp }}/release-archive
      - name: Run the signed Apple Silicon app from the archive that will be published
        shell: bash
        run: |
          app_dir="$RUNNER_TEMP/signed-arm64"
          mkdir -p "$app_dir"
          ditto -x -k "$RUNNER_TEMP/release-archive/CoreLive-${GITHUB_REF_NAME#v}-arm64-mac.zip" "$app_dir"
          app="$app_dir/CoreLive.app"
          test "$(lipo -archs "$app/Contents/MacOS/CoreLive")" = "arm64"
          codesign --verify --strict --deep --all-architectures "$app"
          pnpm --filter @corelive/desktop qa:mcp-package "$app" --hosted-cold-start

  release:
    needs: [build, signed-mac-package]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      # Needed for creating GitHub Releases via gh CLI.
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the verified Apple Silicon artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: electron-app-macos
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -la artifacts/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app="artifacts/CoreLive-${GITHUB_REF_NAME#v}-arm64"
          release_files=(
            "$app.dmg"
            "$app-mac.zip"
            "$app-mac.zip.blockmap"
            artifacts/latest-mac.yml
            artifacts/checksums.json
          )
          for file in "${release_files[@]}"; do
            test -s "$file"
          done

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${release_files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${release_files[@]}" --generate-notes
          fi

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed for uploading SARIF (Trivy).
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
