# Unit coverage for the web and Electron Vitest suites.
name: Coverage

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Unit coverage 📊
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout repository 🔄
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use shared prepare action 🔧
        uses: ./.github/actions/prepare

      - name: Set environment variables
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          {
            printf 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=%s\n' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            printf 'NEXT_PUBLIC_CLERK_SIGN_IN_URL=/login\n'
            printf 'NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up\n'
            printf 'NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL=/home\n'
            printf 'CLERK_SECRET_KEY=%s\n' "$CLERK_SECRET_KEY"
            printf 'WEBHOOK_SECRET=%s\n' "$WEBHOOK_SECRET"
            printf 'POSTGRES_PRISMA_URL=%s\n' 'postgresql://postgres:password@localhost:5491/corelive?schema=public'
          } > .env

      - name: Start Postgres via Docker Compose 🐳
        run: |
          docker compose -f compose.yml -p corelive up -d postgres --wait
          docker ps -a

      - name: Verify database connection 🧪
        run: |
          timeout 60 bash -c 'until docker compose -f compose.yml -p corelive exec postgres env PGPASSWORD=password psql -U postgres -lqt | cut -d \| -f 1 | grep -qw corelive; do sleep 2; done'
          echo "Database 'corelive' exists and is ready!"

      - name: Run Prisma migrations 📦
        run: pnpm prisma migrate deploy

      - name: Generate Prisma Client 🗄️
        run: pnpm prisma generate

      - name: Generate Icons 🎨
        run: pnpm build:icons

      - name: Run unit coverage
        env:
          RUN_DB_INTEGRATION_TESTS: '1'
        run: pnpm coverage:unit

      - name: Upload unit coverage to Codecov ☂️
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/unit-web/lcov.info,./coverage/unit-electron/lcov.info
          flags: unit
          fail_ci_if_error: false

      - name: Upload unit coverage report artifact 📦
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: |
            coverage/unit-web/
            coverage/unit-electron/
          retention-days: 30

      - name: Show Postgres logs on failure 🪵
        if: failure()
        run: docker compose -f compose.yml -p corelive logs postgres | tail -n 200 || true
